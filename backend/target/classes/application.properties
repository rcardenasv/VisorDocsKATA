# =============================================================================
# VisorDocs Backend — Quarkus Configuration
# =============================================================================

# --- HTTP Server ---
quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.body.multipart.max-file-size=${MAX_FILE_SIZE_MB:10}M

# --- Datasource (PostgreSQL) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/visordocs}
quarkus.datasource.username=${DB_USER:visordocs}
quarkus.datasource.password=${DB_PASSWORD:visordocs}

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# --- Elasticsearch ---
quarkus.elasticsearch.hosts=${ELASTICSEARCH_URL:localhost:9200}
quarkus.elasticsearch.java-client.compatibility-mode=true

# --- Application-specific config ---
app.elasticsearch.index=${ELASTICSEARCH_INDEX:documents}
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-size-mb=${MAX_FILE_SIZE_MB:10}
app.upload.allowed-extensions=txt,pdf,md

# --- Dev profile overrides ---
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."com.visordocs".level=DEBUG

# --- Test profile overrides ---
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/visordocs_test
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.elasticsearch.hosts=${ELASTICSEARCH_URL:elasticsearch:9200}
%test.app.upload.dir=./test-uploads
